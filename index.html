<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasemen Pangkalan & Perorangan</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --accent-green: #00ff88;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 0 10px 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Sticky Header Container */
        .sticky-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-dark);
            padding-top: 20px;
            padding-bottom: 15px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            color: var(--accent-green);
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tabs {
            display: flex;
            background-color: var(--card-dark);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-green);
            color: #000;
        }

        .search-box {
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-green);
        }

        /* Table Design */
        .table-wrapper {
            background-color: var(--card-dark);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #181818;
            color: var(--accent-green);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(0, 255, 136, 0.03);
        }

        .rank-badge {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.85rem;
            background-color: #2a2a2a;
            color: var(--text-main);
        }

        tr:nth-child(1) .rank-badge {
            background-color: var(--accent-green);
            color: #000;
        }

        tr:nth-child(2) .rank-badge {
            background-color: #e0e0e0;
            color: #000;
        }

        tr:nth-child(3) .rank-badge {
            background-color: #cd7f32;
            color: #000;
        }

        .poin-highlight {
            color: var(--accent-green);
            font-weight: bold;
        }

        @media (min-width: 600px) {
            .controls {
                flex-direction: row;
            }
            .search-box {
                flex: 2;
            }
            .tabs {
                flex: 3;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Sticky Area -->
    <div class="sticky-header">
        <header>
            <h1>Papan Klasemen</h1>
            <p>Sistem Pemantauan Poin Pangkalan & Perorangan</p>
        </header>

        <div class="controls">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('group')">Pangkalan</button>
                <button class="tab-btn" onclick="switchTab('personal')">Perorangan</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari nama atau pangkalan..." onkeyup="filterData()">
            </div>
        </div>
    </div>

    <!-- Table Body Area -->
    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let groupData = [];
    let personalData = [];
    let currentTab = 'group';

    async function loadData() {
        try {
            const [groupRes, personalRes] = await Promise.all([
                fetch('grouprank.json'),
                fetch('personalrank.json')
            ]);
            groupData = await groupRes.json();
            personalData = await personalRes.json();
            renderTable();
        } catch (error) {
            console.error('Gagal memuat data JSON:', error);
            document.getElementById('tableBody').innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center; color: #ff5555; padding: 20px;">
                        Gagal memuat data. Pastikan berkas JSON berada dalam folder yang sama.
                    </td>
                </tr>`;
        }
    }

    function switchTab(type) {
        currentTab = type;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        
        if (type === 'group') {
            buttons[0].classList.add('active');
        } else {
            buttons[1].classList.add('active');
        }
        
        document.getElementById('searchInput').value = '';
        renderTable();
    }

    function renderTable(filterText = '') {
        const header = document.getElementById('tableHeader');
        const body = document.getElementById('tableBody');
        body.innerHTML = '';

        if (currentTab === 'group') {
            header.innerHTML = `
                <th style="width: 70px; text-align: center;">Rank</th>
                <th>Pangkalan</th>
                <th style="width: 100px; text-align: right;">Poin</th>
            `;

            const filteredData = groupData.filter(item => 
                item.pangkalan.toLowerCase().includes(filterText.toLowerCase())
            );

            filteredData.forEach(item => {
                body.innerHTML += `
                    <tr>
                        <td style="text-align: center;"><span class="rank-badge">${item.rank}</span></td>
                        <td style="font-weight: 600;">${item.pangkalan}</td>
                        <td style="text-align: right;" class="poin-highlight">${item.poin}</td>
                    </tr>
                `;
            });
        } else {
            header.innerHTML = `
                <th style="width: 70px; text-align: center;">Rank</th>
                <th>Nama</th>
                <th>Pangkalan</th>
                <th style="width: 100px; text-align: right;">Poin</th>
            `;

            const filteredData = personalData.filter(item => 
                item.nama.toLowerCase().includes(filterText.toLowerCase()) ||
                item.pangkalan.toLowerCase().includes(filterText.toLowerCase())
            );

            filteredData.forEach(item => {
                body.innerHTML += `
                    <tr>
                        <td style="text-align: center;"><span class="rank-badge">${item.rank}</span></td>
                        <td style="font-weight: 600;">${item.nama}</td>
                        <td style="color: var(--text-muted);">${item.pangkalan}</td>
                        <td style="text-align: right;" class="poin-highlight">${item.poin}</td>
                    </tr>
                `;
            });
        }
    }

    function filterData() {
        const query = document.getElementById('searchInput').value;
        renderTable(query);
    }

    loadData();
</script>

</body>
</html>
