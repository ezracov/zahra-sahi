<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasemen Pangkalan & Perorangan</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --accent-green: #00ff88;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 0 8px 20px 8px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Sticky Header Control Container */
        .sticky-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-dark);
            padding-top: 15px;
            padding-bottom: 10px;
            z-index: 100;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        header h1 {
            color: var(--accent-green);
            font-size: 1.5rem;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tabs {
            display: flex;
            background-color: var(--card-dark);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-green);
            color: #000;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-green);
        }

        /* Table Structure & Sticky Table Header */
        .table-wrapper {
            background-color: var(--card-dark);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 8px;
            overflow-x: hidden;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            table-layout: fixed;
        }

        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 0.85rem;
        }

        /* Penyesuaian offset posisi Sticky TH agar pas di bawah Sticky Header */
        th {
            background-color: #181818;
            color: var(--accent-green);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 125px; /* Disesuaikan agar menempel pas di bawah controls pada mobile */
            z-index: 90;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(0, 255, 136, 0.03);
        }

        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.75rem;
            background-color: #2a2a2a;
            color: var(--text-main);
        }

        tr:nth-child(1) .rank-badge {
            background-color: var(--accent-green);
            color: #000;
        }

        tr:nth-child(2) .rank-badge {
            background-color: #e0e0e0;
            color: #000;
        }

        tr:nth-child(3) .rank-badge {
            background-color: #cd7f32;
            color: #000;
        }

        .poin-highlight {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Layout Compact untuk Nama + Pangkalan + Tombol Hadiah */
        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
        }

        .name-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .name-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub-pangkalan {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-hadiah {
            padding: 3px 6px;
            font-size: 0.7rem;
            background-color: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .btn-hadiah:hover {
            background-color: var(--accent-green);
            color: #000;
        }

        /* Penyesuaian Offset Sticky Header pada Desktop */
        @media (min-width: 600px) {
            .controls {
                flex-direction: row;
            }
            .search-box {
                flex: 2;
            }
            .tabs {
                flex: 3;
            }
            th {
                top: 105px; /* Offset disesuaikan ketika kontrol berjajar horizontal */
            }
            th, td {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sticky-header">
        <header>
            <h1>Klasemen Sementara</h1>
            <p>Member Zahra Sahi</p>
        </header>

        <div class="controls">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('group')">Pangkalan</button>
                <button class="tab-btn" onclick="switchTab('personal')">Perorangan</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari nama atau pangkalan..." onkeyup="filterData()">
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let groupData = [];
    let personalData = [];
    let currentTab = 'group';

    async function loadData() {
        try {
            const [groupRes, personalRes] = await Promise.all([
                fetch('grouprank.json'),
                fetch('personalrank.json')
            ]);
            groupData = await groupRes.json();
            personalData = await personalRes.json();
            renderTable();
        } catch (error) {
            console.error('Gagal memuat data JSON:', error);
            document.getElementById('tableBody').innerHTML = `
                <tr>
                    <td colspan="3" style="text-align: center; color: #ff5555; padding: 20px;">
                        Gagal memuat data. Pastikan berkas JSON berada dalam folder yang sama.
                    </td>
                </tr>`;
        }
    }

    function switchTab(type) {
        currentTab = type;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        
        if (type === 'group') {
            buttons[0].classList.add('active');
        } else {
            buttons[1].classList.add('active');
        }
        
        document.getElementById('searchInput').value = '';
        renderTable();
    }

    function renderTable(filterText = '') {
        const header = document.getElementById('tableHeader');
        const body = document.getElementById('tableBody');
        body.innerHTML = '';

        if (currentTab === 'group') {
            header.innerHTML = `
                <th style="width: 45px; text-align: center;">Rank</th>
                <th>Pangkalan</th>
                <th style="width: 75px; text-align: right;">Poin</th>
            `;

            const filteredData = groupData.filter(item => 
                item.pangkalan.toLowerCase().includes(filterText.toLowerCase())
            );

            filteredData.forEach(item => {
                const hadiahText = item.hadiah || 'Belum ada hadiah';
                body.innerHTML += `
                    <tr>
                        <td style="text-align: center;"><span class="rank-badge">${item.rank}</span></td>
                        <td>
                            <div class="name-wrapper">
                                <div class="name-info">
                                    <span class="name-title">${item.pangkalan}</span>
                                </div>
                                <button class="btn-hadiah" onclick="lihatHadiah('${item.pangkalan}', '${hadiahText}')">🎁 Hadiah</button>
                            </div>
                        </td>
                        <td style="text-align: right;" class="poin-highlight">${item.poin}</td>
                    </tr>
                `;
            });
        } else {
            header.innerHTML = `
                <th style="width: 45px; text-align: center;">Rank</th>
                <th>Nama & Pangkalan</th>
                <th style="width: 75px; text-align: right;">Poin</th>
            `;

            const filteredData = personalData.filter(item => 
                item.nama.toLowerCase().includes(filterText.toLowerCase()) ||
                item.pangkalan.toLowerCase().includes(filterText.toLowerCase())
            );

            filteredData.forEach(item => {
                const hadiahText = item.hadiah || 'Belum ada hadiah';
                body.innerHTML += `
                    <tr>
                        <td style="text-align: center;"><span class="rank-badge">${item.rank}</span></td>
                        <td>
                            <div class="name-wrapper">
                                <div class="name-info">
                                    <span class="name-title">${item.nama}</span>
                                    <span class="sub-pangkalan">${item.pangkalan}</span>
                                </div>
                                <button class="btn-hadiah" onclick="lihatHadiah('${item.nama}', '${hadiahText}')">🎁 Hadiah</button>
                            </div>
                        </td>
                        <td style="text-align: right;" class="poin-highlight">${item.poin}</td>
                    </tr>
                `;
            });
        }
    }

    function lihatHadiah(nama, hadiah) {
        alert(`Hadiah untuk ${nama}:\n🎁 ${hadiah}`);
    }

    function filterData() {
        const query = document.getElementById('searchInput').value;
        renderTable(query);
    }

    loadData();
</script>

</body>
</html>
